# Database Configuration
spring.datasource.url=jdbc:hsqldb:mem:testdb
spring.datasource.driver-class-name=org.hsqldb.jdbc.JDBCDriver
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.HSQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# View Resolver
spring.mvc.view.prefix=/WEB-INF/jsp/
spring.mvc.view.suffix=.jsp

# MyBatis Configuration
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.naver.test
mybatis.configuration.map-underscore-to-camel-case=true

# Logging Configuration
logging.level.com.naver.test=DEBUG
logging.level.org.mybatis=DEBUG
logging.level.com.naver.test.notice.mapper.NoticeMapper=DEBUG
logging.level.com.naver.test.user.mapper.UserMapper=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Internationalization
spring.messages.basename=properties/messages
spring.messages.encoding=UTF-8
spring.messages.cache-duration=3600

# Performance Monitoring
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# Application Variables
application.message=Hello LeeJeongWha - Enhanced Version